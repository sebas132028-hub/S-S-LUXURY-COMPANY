<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · S&amp;S Luxury Company</title>
<style>
:root{--au:#d4af5a;--au2:#b8943f;--line:#1f2227;--mid:#7d8189}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(900px 500px at 80% -10%,#15171c,#050607 60%) fixed,#050607;color:#e9eaec;font:16px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
.btn{background:linear-gradient(180deg,#1c1e23,#0b0c0e);border:1px solid var(--au2);padding:11px 18px;font-weight:700;cursor:pointer}
.btn:hover{background:linear-gradient(180deg,#ecca78,var(--au2));color:#050607}
.gh{background:none;border:1px solid #33363d;padding:7px 12px;font-size:.85rem;cursor:pointer}
.gh:hover{border-color:var(--au);color:var(--au)}
input,select,textarea{background:#08090b;border:1px solid #2a2d33;padding:11px;width:100%}
label{display:grid;gap:6px;font-size:.85rem;color:var(--mid)}
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(380px,100%);border:1px solid var(--line);background:#0d0e11;padding:28px;display:grid;gap:14px}
h1{font-size:1.5rem;letter-spacing:.04em}
.err{color:#e0a458;font-size:.9rem;min-height:1.2em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,6,7,.92);z-index:5}
main{max-width:900px;margin:0 auto;padding:20px 5vw 80px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
form{display:none;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;background:#0d0e11;border:1px solid var(--au2);padding:16px;margin-bottom:18px}
form.on{display:grid}
.full{grid-column:1/-1}
.acts{display:flex;gap:8px;grid-column:1/-1}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#0d0e11;border:1px solid var(--line);padding:10px;margin-bottom:8px}
.row img{width:64px;height:80px;object-fit:cover;background:#15171c}
.row small{display:block;color:var(--mid)}
.row .b{display:flex;flex-direction:column;gap:6px}
.off{color:#e0a458}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--au);color:#050607;padding:10px 18px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}
#t.on{opacity:1}
.lg{width:min(270px,72%);margin:0 auto;display:block;mix-blend-mode:lighten}
.pn{text-align:center;color:var(--mid);letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;margin-top:-6px}
.hl{height:40px;width:auto;display:block;mix-blend-mode:lighten}
</style>
</head>

  <main>
    <div class="top"><h1>Productos</h1><button class="btn" id="new">+ Nuevo</button></div>
    <form id="f">
      <label class="full">Nombre<input id="n" required></label>
      <label>Precio (COP)<input id="p" type="number" min="0" required></label>
      <label>Categoría<input id="c" list="cl" value="Camisetas" required><datalist id="cl"></datalist></label>
      <label class="full">Tallas (separadas por coma)<input id="s" value="S,M,L,XL"></label>
      <label class="full">Descripción<textarea id="d" rows="2"></textarea></label>
      <label class="full">Foto<input id="ph" type="file" accept="image/*"></label>
      <label class="full" style="display:flex;gap:8px;align-items:center"><input id="a" type="checkbox" checked style="width:auto"> Visible en la tienda</label>
      <div class="acts"><button class="btn" type="submit" id="sv">Guardar</button><button class="gh" type="button" id="cn">Cancelar</button></div>
    </form>
    <div id="list"></div>
  </main>

<div id="t"></div>

<script>
var SB="https://frbzfeahckaoiargsyqi.supabase.co",KEY="sb_publishable_EH7OcsmHSotHfa9eqbjxgA_nYuQ1285",tok=null,rows=[],eid=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function H(x){return Object.assign({apikey:KEY,Authorization:"Bearer "+(tok||KEY)},x||{})}
function toast(m){var e=$("t");e.textContent=m;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},2000)}
function money(n){return "$"+Number(n).toLocaleString("es-CO")}
function show(on){$("login").hidden=on;$("app").hidden=!on}
function out(){tok=null;try{sessionStorage.removeItem("tk")}catch(e){}show(false)}
$("go").onclick=async function(){
  $("er").textContent="";
  try{
    var r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
    var j=await r.json();
    if(!r.ok||!j.access_token){$("er").textContent="Correo o contraseña incorrectos.";return}
    tok=j.access_token;try{sessionStorage.setItem("tk",tok)}catch(e){}
    show(true);load();
  }catch(e){$("er").textContent="No se pudo conectar. Revisa tu internet."}
};
$("out").onclick=out;
async function load(){
  var r=await fetch(SB+"/rest/v1/products?select=*&order=id.desc",{headers:H()});
  if(r.status===401){out();return}
  rows=await r.json();
  var cats=[];rows.forEach(function(p){if(cats.indexOf(p.category)<0)cats.push(p.category)});
  $("cl").innerHTML=cats.map(function(c){return '<option value="'+esc(c)+'">'}).join("");
  $("list").innerHTML=rows.length?rows.map(function(p){return '<div class="row"><img src="'+esc(p.image_url)+'" alt=""><div><b>'+esc(p.name)+'</b><small>'+money(p.price)+' · '+esc(p.category)+(p.active?'':' · <span class="off">Oculto</span>')+'</small></div><div class="b"><button class="gh" data-e="'+p.id+'">Editar</button><button class="gh" data-x="'+p.id+'">Borrar</button></div></div>'}).join(""):'<p style="color:#7d8189">Aún no hay productos. Toca "+ Nuevo" para subir el primero.</p>';
}
function openF(p){
  eid=p?p.id:null;
  $("n").value=p?p.name:"";$("p").value=p?p.price:"";$("c").value=p?p.category:"Camisetas";
  $("s").value=p?p.sizes:"S,M,L,XL";$("d").value=p?p.description||"":"";$("a").checked=p?p.active:true;$("ph").value="";
  $("f").classList.add("on");$("f").scrollIntoView({behavior:"smooth"});
}
$("new").onclick=function(){openF(null)};
$("cn").onclick=function(){$("f").classList.remove("on")};
$("list").onclick=async function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)openF(rows.find(function(p){return p.id==b.dataset.e}));
  if(b.dataset.x&&confirm("¿Borrar este producto?")){
    var r=await fetch(SB+"/rest/v1/products?id=eq."+b.dataset.x,{method:"DELETE",headers:H()});
    toast(r.ok?"Producto borrado":"No se pudo borrar");load();
  }
};
function shrink(file){return new Promise(function(ok,no){
  var im=new Image();im.onload=function(){
    var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    c.toBlob(function(b){b?ok(b):no()},"image/jpeg",.82);
  };im.onerror=no;im.src=URL.createObjectURL(file);
})}
$("f").onsubmit=async function(e){
  e.preventDefault();
  var cur=eid?rows.find(function(p){return p.id==eid}):null,url=cur?cur.image_url:null,f=$("ph").files[0];
  if(!f&&!url){toast("Falta la foto");return}
  $("sv").disabled=true;
  try{
    if(f){
      var blob=await shrink(f),name=Date.now()+".jpg";
      var u=await fetch(SB+"/storage/v1/object/products/"+name,{method:"POST",headers:H({"Content-Type":"image/jpeg"}),body:blob});
      if(!u.ok)throw 0;
      url=SB+"/storage/v1/object/public/products/"+name;
    }
    var body={name:$("n").value.trim(),price:parseInt($("p").value,10)||0,category:$("c").value.trim()||"Camisetas",sizes:$("s").value.trim()||"S,M,L,XL",description:$("d").value.trim(),active:$("a").checked,image_url:url};
    var r=await fetch(SB+"/rest/v1/products"+(eid?"?id=eq."+eid:""),{method:eid?"PATCH":"POST",headers:H({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify(body)});
    if(!r.ok)throw 0;
    toast("Guardado");$("f").classList.remove("on");load();
  }catch(x){toast("Error al guardar. Intenta otra vez.")}
  $("sv").disabled=false;
};
try{var t=sessionStorage.getItem("tk");if(t){tok=t;show(true);load()}}catch(e){}
</script>
